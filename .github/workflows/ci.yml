name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck core
        working-directory: packages/core
        run: pnpm exec tsc --noEmit

      - name: Run core tests
        working-directory: packages/core
        run: pnpm exec vitest run

      - name: Typecheck engram-adapter
        working-directory: packages/engram-adapter
        run: pnpm exec tsc --noEmit

      - name: Typecheck mastra-middleware
        working-directory: packages/mastra-middleware
        run: pnpm exec tsc --noEmit
